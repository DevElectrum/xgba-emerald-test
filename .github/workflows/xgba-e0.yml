name: XGBA Emerald E0

on:
  push:
    branches:
      - xgba/e0-expanded-layout
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  expanded-rom:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out Emerald fork
        uses: actions/checkout@v4

      - name: Check out agbcc toolchain
        uses: actions/checkout@v4
        with:
          repository: pret/agbcc
          path: agbcc

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi libpng-dev

      - name: Install agbcc
        working-directory: agbcc
        run: |
          ./build.sh
          ./install.sh ../

      - name: Build normal Emerald
        run: make -j2 all

      - name: Validate E0 packer syntax
        run: python3 -m py_compile tools/xgba_pack_emerald.py

      - name: Generate 64 MiB XGBA cartridge
        run: |
          python3 tools/xgba_pack_emerald.py pack \
            --rom pokeemerald.gba \
            --elf pokeemerald.elf \
            --map-bin data/layouts/LittlerootTown/map.bin \
            --output xgba-emerald-e0.gba

      - name: Independently reverify generated cartridge
        run: |
          python3 tools/xgba_pack_emerald.py verify \
            --rom pokeemerald.gba \
            --elf pokeemerald.elf \
            --map-bin data/layouts/LittlerootTown/map.bin \
            --output xgba-emerald-e0.gba

      - name: Confirm baseline and expanded cartridge sizes
        run: |
          test -f pokeemerald.gba
          test -f pokeemerald.elf
          test "$(stat -c%s xgba-emerald-e0.gba)" -eq 67108864

      # Deliberately do not upload or commit generated Pokemon ROM binaries.
